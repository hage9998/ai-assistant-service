apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-assistant-api-config
  namespace: life-gamefication-dev
data:
  # App
  APP_NAME: gamification-llm-service
  ENVIRONMENT: development
  DEBUG: "true"

  # Database
  DATABASE_URL: postgresql+asyncpg://postgres:root@postgres-ai-assistant.life-gamefication-dev.svc.cluster.local:5432/ai-assistant-db
  DATABASE_ECHO: "false"

  # JWT (deve ser a MESMA secret configurada no backend NestJS)
  JWT_SECRET: jwt_secret
  JWT_ALGORITHM: HS256

  # CORS
  CORS_ORIGINS: '["http://192.168.49.2:30007"]'

  # LLM / Ollama
  OLLAMA_BASE_URL: http://ollama.default.svc.cluster.local:11434
  OLLAMA_MODEL: llama3.1
  LLM_TEMPERATURE: "0.7"

  # Logging
  LOG_LEVEL: INFO
