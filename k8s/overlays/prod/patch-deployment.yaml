apiVersion: apps/v1
kind: Deployment
metadata:
  name: life-gamefication
  namespace: life-gamefication-dev
spec:
  template:
    spec:
      containers:
        - name: life-gamefication
          image: image:latest
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
